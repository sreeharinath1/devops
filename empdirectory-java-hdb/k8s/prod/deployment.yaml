apiVersion: apps/v1
kind: Deployment
metadata:
  name: sree-empdir
  namespace: prod
spec:
  selector:
    matchLabels:
      app: web-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  replicas: 2
  template:
    metadata:
      name: sree-empdir
      labels:
        app: web-app
    spec:
      containers:
        - name: sree-empdir
          image: sreeharinathpdev/empdir:latest
          image_pull_policy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelyaSeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3

